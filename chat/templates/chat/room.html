<!DOCTYPE html>
<html>
<head>
    <title>Chat Room</title>
</head>
<body>
    <h2>Room: {{ room_name }}</h2>
    <p>Logged in as {{ user.username }}</p> # changed 

    <div id="chat-log" style="border:1px solid #ccc; height:300px; overflow-y:scroll; padding:10px;"></div>

    <br>
    <input id="chat-message-input" type="text" placeholder="Type a message" size="50">
    <button id="chat-message-submit">Send</button>

    {{ room_name|json_script:"room-name" }}

    <script>
        const roomName = JSON.parse(document.getElementById('room-name').textContent);

        const chatSocket = new WebSocket(
            'ws://' + window.location.host + '/ws/chat/' + roomName + '/'
        );

        chatSocket.onmessage = function(e) {
            const data = JSON.parse(e.data);
            const chatLog = document.getElementById('chat-log');
            chatLog.innerHTML += '<p><strong>' + data.sender + ':</strong> ' + data.message + '</p>';
            chatLog.scrollTop = chatLog.scrollHeight;
        };

        chatSocket.onclose = function(e) {
            console.error('Chat socket closed unexpectedly');
        };

        document.getElementById('chat-message-submit').onclick = function(e) {
            const messageInput = document.getElementById('chat-message-input');

            chatSocket.send(JSON.stringify({
                'message': messageInput.value      // only the message: the server knows who you are
            }));

            messageInput.value = '';
        };
    </script>
</body>
</html>
